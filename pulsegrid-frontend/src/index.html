<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <title>PulseGrid</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Set the theme attribute before Angular boots (and before first paint)
    // so a saved dark-mode preference doesn't flash light for a moment —
    // mirrors the same lookup ThemeService does at startup.
    (function () {
      try {
        var saved = localStorage.getItem('pulsegrid.theme');
        var mode = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <pg-root></pg-root>
</body>
</html>
